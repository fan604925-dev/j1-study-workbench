<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2f80ed">
<title>成长激励 · 初一学习工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-container">
  <div class="sticky-header flex items-center justify-between">
    <div class="font-bold flex items-center gap-1" style="color:var(--text-strong);"><span data-icon="leaf" data-icon-size="18"></span> 成长激励</div>
    <span class="text-xs" style="color:var(--muted);">仅家长可见 · 奖励努力不奖励分数</span>
  </div>

  <!-- 连续打卡 -->
  <div class="card">
    <div class="flex items-center justify-between mb-2">
      <div class="card-title flex items-center gap-1" style="margin:0;"><span data-icon="fire" data-icon-size="16"></span> 连续打卡</div>
      <div class="text-xs" style="color:var(--muted);">最长 <b id="streak-best">0</b> 天</div>
    </div>
    <div class="flex items-center gap-4">
      <div class="text-4xl font-black" style="background:var(--grad-brand);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;" id="streak-num">0</div>
      <div class="text-xs" style="color:var(--muted);">天连续<br>「每天都坐下来」</div>
      <button class="btn btn-primary btn-sm" onclick="checkin()" id="btn-checkin">今日打卡</button>
    </div>
    <div class="checkin-grid mt-3" id="checkin-grid"></div>
  </div>

  <!-- 徽章墙 -->
  <div class="card">
    <div class="card-title flex items-center gap-1"><span data-icon="medal" data-icon-size="16"></span> 徽章墙</div>
    <div class="grid grid-cols-4 gap-2" id="badge-wall"></div>
    <div class="text-xs mt-2" style="color:var(--muted);">徽章记录的是行为（重做、提问、坚持），不是分数；解锁后不撤销</div>
  </div>

  <!-- 知识点点亮地图 -->
  <div class="card">
    <div class="card-title flex items-center gap-1"><span data-icon="sparkle" data-icon-size="16"></span> 知识点点亮地图</div>
    <div class="text-xs mb-2" style="color:var(--muted);">连对 3 次 + 掌握度达标 + 妈妈确认掌握标准 → 点亮一个知识点</div>
    <div id="star-map"></div>
  </div>

  <!-- 表扬话术库 -->
  <div class="card">
    <div class="card-title flex items-center gap-1"><span data-icon="chat" data-icon-size="16"></span> 表扬话术库</div>
    <div class="chip-row scroll-x mb-2" id="scene-chips"></div>
    <div id="praise-list"></div>
  </div>

  <!-- 特权清单 -->
  <div class="card">
    <div class="card-title flex items-center gap-1"><span data-icon="gift" data-icon-size="16"></span> 非货币小特权</div>
    <div class="text-xs mb-2" style="color:var(--muted);">不定价格、不攒兑换——妈妈觉得他这周够努力就直接送，让奖励是惊喜不是交易</div>
    <div id="privilege-list"></div>
  </div>

  <div class="text-xs text-center mb-2" style="color:var(--muted);">
    本页仅家长可见；孩子只看纸上的「今日待办」和一句鼓励
  </div>
</div>
<div id="bottom-nav"></div>

<script src="js/data/kpoints.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  'use strict';
  const E = J1Engine;
  let scene = 'hard_task';

  const SCENES = [
    { id: 'hard_task', name: '完成难任务' }, { id: 'exam_progress', name: '考试进步' },
    { id: 'initiative', name: '主动学习' }, { id: 'frustration', name: '遇到挫折' },
    { id: 'habit', name: '坚持习惯' }
  ];

  function render() {
    const today = E.date.today();
    const st = E.streak(J1Store.habitEvents, today);
    document.getElementById('streak-num').textContent = st.current;
    document.getElementById('streak-best').textContent = st.best;
    document.getElementById('btn-checkin').textContent = st.checkedToday ? '✓ 已打卡' : '今日打卡';

    // 14 天格子
    const cells = [];
    for (let i = 13; i >= 0; i--) {
      const d = E.date.shift(today, -i);
      const on = J1Store.habitEvents.some(h => h.type === 'checkin' && h.date === d);
      cells.push('<div class="checkin-cell ' + (on ? 'on' : '') + '" title="' + d + '"></div>');
    }
    document.getElementById('checkin-grid').innerHTML = cells.join('');

    renderBadges();
    renderStars();
    renderPraise();
    renderPrivileges();
  }

  function renderBadges() {
    const today = E.date.today();
    const unlocked = new Map(J1Store.badges.map(b => [b.id, b]));
    const counts = {};
    J1Store.mistakes.forEach(m => { if (m.status === 'redo_right') counts.redoRight = (counts.redoRight || 0) + 1; });
    J1Store.habitEvents.forEach(h => { if (counts[h.type] !== undefined) counts[h.type] = (counts[h.type] || 0) + 1; });
    Object.keys(J1Store.kpointStates).forEach(k => {
      if (J1Store.kpointStates[k].lit) counts.lit = (counts.lit || 0) + 1;
    });
    Object.keys(J1Store.todos).forEach(d => {
      J1Store.todos[d].forEach(t => { if (t.hardToStart && t.status === 'completed') counts.hardDone = (counts.hardDone || 0) + 1; });
    });
    const st = E.streak(J1Store.habitEvents, today);
    const streakVal = Math.max(st.current, st.best);

    document.getElementById('badge-wall').innerHTML = E.BADGES.map(def => {
      const b = unlocked.get(def.id);
      const v = def.type === 'streak' ? streakVal : (counts[def.type] || 0);
      const pct = Math.min(100, Math.round(v / def.threshold * 100));
      return '<div class="badge-item ' + (b ? '' : 'locked') + '" onclick="badgeInfo(\'' + def.id + '\')">' +
        '<div class="badge-icon">' + J1Icons.render(def.icon, 26) + '</div>' +
        '<div class="badge-name">' + def.name + '</div>' +
        (b ? '<div class="text-xs" style="color:var(--success);">已解锁</div>'
           : '<div style="margin:4px 6px 0;">' + app.progressBar(pct / 100, 'yellow') + '</div>' +
             '<div class="text-xs" style="color:var(--muted);">' + v + '/' + def.threshold + '</div>') +
        '</div>';
    }).join('');
  }

  window.badgeInfo = function (id) {
    const def = E.BADGES.find(b => b.id === id);
    const got = J1Store.badges.some(b => b.id === id);
    app.toast(def.name + '：' + def.desc + (got ? '（已解锁）' : ''));
  };

  function renderStars() {
    const today = E.date.today();
    const kps = J1Store.getKpoints();
    const bySubj = {};
    kps.forEach(k => { if (!bySubj[k.subject]) bySubj[k.subject] = []; bySubj[k.subject].push(k); });
    const litCount = kps.filter(k => (J1Store.kpointStates[k.id] || {}).lit).length;
    let html = '<div class="text-xs mb-2" style="color:var(--muted);">已点亮 ' + litCount + ' / ' + kps.length + ' 个知识点</div>';
    Object.keys(bySubj).forEach(subj => {
      html += '<div class="flex items-center gap-2 mb-1"><span>' + app.subjectTag(subj) + '</span></div>';
      html += '<div class="star-track">';
      bySubj[subj].forEach(k => {
        const st = J1Store.kpointStates[k.id];
        const cls = st && st.lit ? 'lit' : st && (st.mastery || 0) > 0 ? 'learning' : '';
        const icon = st && st.lit ? J1Icons.render('sparkle', 13) : st && (st.mastery || 0) > 0 ? '·' : '';
        html += '<div class="star-node ' + cls + '" onclick="kpointInfo(\'' + k.id + '\')" title="' + app.escapeHtml(k.name) + '">' +
          (icon || '<span style="font-size:10px;color:var(--muted);">' + app.escapeHtml(k.chapter.slice(0, 2)) + '</span>') + '</div>';
      });
      html += '</div>';
    });
    document.getElementById('star-map').innerHTML = html;
  }

  window.kpointInfo = function (id) {
    const k = J1Store.getKpoint(id);
    if (!k) return;
    const st = J1Store.getKpointState(id);
    const mistakes = J1Store.mistakes.filter(m => m.kpointId === id && !m.archived);
    const msg = k.name + '（' + k.chapter + '）\n' +
      '怎么补：' + k.prescription.microLesson + '\n' +
      '练什么：' + k.prescription.practiceTypes.join(' / ') + '\n' +
      '掌握标准：' + k.prescription.masteryCriteria + '\n' +
      '相关错题：' + mistakes.length + ' 题；掌握度 ' + Math.round((st.mastery || 0) * 100) + '%，连对 ' + (st.redoRightStreak || 0) + ' 次' +
      (st.lit ? '\n已点亮！' :
        (st.redoRightStreak >= 3 && (st.mastery || 0) >= 0.8 ? '\n条件已满足，可确认点亮' : ''));
    if (st.redoRightStreak >= 3 && (st.mastery || 0) >= 0.8 && !st.lit) {
      if (app.confirm(msg + '\n\n确认「已达到掌握标准」并点亮这个知识点吗？')) {
        st.criteriaConfirmed = true;
        J1Store.save();
        const res = J1Store.tryLightKpoint(id, E.date.today());
        if (res.justLit) {
          const fresh = J1Store.evaluateBadges();
          const praises = J1Store.praiseLibrary.filter(p => p.scene === 'hard_task' || p.scene === 'habit');
          const p = praises.length ? praises[Math.floor(Math.random() * praises.length)] : null;
          app.toast('点亮了「' + k.name + '」！' + (p ? '话术参考：' + p.text.slice(0, 30) + '…' : ''));
          if (fresh.length) setTimeout(() => app.toast('新徽章：' + fresh.map(b => b.name).join('、')), 1200);
        }
        render();
      }
    } else {
      alert(msg);
    }
  };

  function renderPraise() {
    document.getElementById('scene-chips').innerHTML = SCENES.map(s =>
      '<span class="chip ' + (scene === s.id ? 'active' : '') + '" onclick="setScene(\'' + s.id + '\')">' + s.name + '</span>'
    ).join('');
    const list = J1Store.praiseLibrary.filter(p => p.scene === scene);
    document.getElementById('praise-list').innerHTML = list.length
      ? list.map(p =>
        '<div class="praise-card"><div class="mb-1">' + app.escapeHtml(p.text) + '</div>' +
        '<div class="flex items-center justify-between">' +
        '<span class="text-xs" style="color:var(--muted);">' + (p.tip ? app.escapeHtml(p.tip) : '') + '</span>' +
        '<button class="btn btn-sm btn-ghost flex items-center gap-1" onclick="usePraise(\'' + p.id + '\')">' + J1Icons.render('copy', 13) + ' 复制</button></div></div>'
      ).join('')
      : '<div class="text-xs text-center py-2" style="color:var(--muted);">这个场景还没有话术</div>';
  }
  window.setScene = function (s) { scene = s; renderPraise(); };
  window.usePraise = function (id) {
    const p = J1Store.usePraise(id);
    app.copyText(p ? p.text : '').then(ok => app.toast(ok ? '已复制，照着说就行' : '复制失败'));
  };

  function renderPrivileges() {
    const I = J1Icons;
    const weekKey = E.date.weekStart(E.date.today());
    const grantedThisWeek = J1Store.privileges.find(p => p.grantedWeek === weekKey);
    let html = grantedThisWeek
      ? '<div class="praise-card flex items-center gap-2">' + I.render(grantedThisWeek.icon, 18) + ' 本周已送：' + app.escapeHtml(grantedThisWeek.title) +
        (grantedThisWeek.usedAt ? '（已使用）' : '（未使用）') + '</div>'
      : '<div class="text-xs mb-2" style="color:var(--warning);">本周还没送过——看到他努力的时刻就送一个</div>';
    html += '<div class="grid grid-cols-1 gap-2">' + J1Store.privileges.map(p => {
      const used = p.grantedWeek === weekKey;
      return '<div class="task-item" style="margin-bottom:6px;">' +
        '<div style="flex:1;"><div class="text-sm font-medium flex items-center gap-1">' + I.render(p.icon, 18) + ' ' + app.escapeHtml(p.title) + '</div>' +
        '<div class="text-xs" style="color:var(--muted);">' + app.escapeHtml(p.note || '') + '</div></div>' +
        (used
          ? '<span class="tag" style="background:#eafaf0;color:#166534;">本周已送</span>'
          : '<button class="btn btn-sm btn-ghost" onclick="grantPv(\'' + p.id + '\')">本周送给他</button>') +
        '</div>';
    }).join('') + '</div>';
    document.getElementById('privilege-list').innerHTML = html;
  }
  window.grantPv = function (id) {
    const p = J1Store.grantPrivilege(id, E.date.weekStart(E.date.today()));
    app.toast('已记录：' + p.title + '。今晚告诉他，让他自己安排');
    renderPrivileges();
  };

  window.checkin = function () {
    J1Store.addHabitEvent('checkin', null, '');
    const fresh = J1Store.evaluateBadges();
    if (fresh.length) app.toast('新徽章：' + fresh.map(b => b.name).join('、'));
    render();
  };

  document.addEventListener('DOMContentLoaded', function () {
    app.injectNav();
    J1Icons.hydrate();
    try { render(); } catch (e) { console.error(e); }
  });
})();
</script>
</body>
</html>
