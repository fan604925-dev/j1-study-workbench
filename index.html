<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2f80ed">
<title>看板 · 初一学习工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-container">

  <div class="flex items-center justify-between mb-3">
    <div>
      <div class="text-lg font-bold" id="today-cn" style="color:var(--text-strong);"></div>
      <div class="text-xs" style="color:var(--muted);">把基础一小步一小步补牢</div>
    </div>
    <a href="settings.html" class="text-xl no-underline" style="text-decoration:none;color:var(--muted);" aria-label="设置"><span data-icon="settings" data-icon-size="22"></span></a>
  </div>

  <!-- 材料投放口 -->
  <div class="card" style="border-left:3px solid var(--brand);">
    <div class="flex items-start gap-2">
      <span style="color:var(--brand);" data-icon="camera" data-icon-size="22"></span>
      <div style="flex:1;">
        <div class="text-sm font-semibold" style="color:var(--text-strong);">把孩子的材料发到 WorkBuddy 对话里</div>
        <div class="text-xs mt-1" style="color:var(--muted);">试卷 / 作业照片、考了几分、哪天考、复习了什么、哪个知识点学会了——随手发，AI 自动识别、归类、更新这个看板。不用录、不用分类。</div>
        <div class="text-xs mt-1" id="feed-meta" style="color:var(--muted);"></div>
      </div>
    </div>
  </div>

  <!-- 孩子概况 + 今日进度环 -->
  <div class="child-card" id="child-card"></div>

  <!-- 三仪表 -->
  <div class="card">
    <div class="card-title">完成率仪表</div>
    <div class="meter-grid" id="meter-grid"></div>
    <div class="text-xs mt-2 text-center" id="baseline-tip" style="color:var(--muted);"></div>
  </div>

  <!-- 月目标进度（AI 维护） -->
  <div class="card">
    <div class="card-title"><span>本月目标</span></div>
    <div id="goal-list"></div>
  </div>

  <!-- 图表 -->
  <div class="card">
    <div class="card-title">近 7 日完成率</div>
    <div style="height:160px;"><canvas id="chart-week"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title">考试分数趋势</div>
    <div style="height:170px;"><canvas id="chart-exam"></canvas></div>
    <div class="text-xs mt-2" id="exam-trend-text" style="color:var(--muted);"></div>
  </div>
  <div class="card">
    <div class="card-title">错题科目分布</div>
    <div style="height:180px;"><canvas id="chart-mistake"></canvas></div>
  </div>

  <!-- 需关注 -->
  <div class="card">
    <div class="card-title">需要关注</div>
    <div id="attention-list"></div>
  </div>

  <!-- 快捷入口 -->
  <div class="card">
    <div class="card-title">快捷入口</div>
    <div class="quick-grid" id="quick-grid"></div>
  </div>

  <div class="text-center mt-4 mb-2">
    <button class="btn btn-outline btn-sm" onclick="app.repairAndReload()"><span data-icon="wrench" data-icon-size="16"></span> 界面异常？一键修复（不删数据）</button>
  </div>
</div>
<div id="bottom-nav"></div>

<script src="js/data/kpoints.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/icons.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  'use strict';
  function render() {
    const store = J1Store, E = J1Engine;
    const today = E.date.today();
    document.getElementById('today-cn').textContent = app.formatDate(today);

    // feed 更新信息
    const feedMeta = document.getElementById('feed-meta');
    if (store.meta.lastFeedAt) {
      const t = new Date(store.meta.lastFeedAt);
      const when = (t.getMonth() + 1) + '/' + t.getDate() + ' ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
      feedMeta.textContent = 'AI 最近更新：' + when + '（第 ' + (store.meta.lastFeedVersion || 0) + ' 次投放）';
      feedMeta.style.color = 'var(--brand)';
    } else {
      feedMeta.textContent = '还没有投放记录——现在就可以发第一张试卷照片试试';
    }

    const prog = E.computeProgress(store, today);

    // 孩子卡
    const child = store.settings.child;
    document.getElementById('child-card').innerHTML =
      app.progressRingSVG(prog.today.rate, 64) +
      '<div style="flex:1;">' +
      '<div class="font-bold text-base" style="color:var(--text-strong);">' + app.escapeHtml(child.name) + ' · ' + app.escapeHtml(child.grade) + '</div>' +
      '<div class="text-xs mt-1" style="color:var(--muted);">弱科：' + app.subjectName(child.weakSubject) + '</div>' +
      '<div class="text-xs mt-1" style="color:var(--muted);">' + app.escapeHtml(child.note || '') + '</div>' +
      '</div>';

    // 三仪表
    const meters = [
      { label: '今日', rate: prog.today.rate },
      { label: '本周', rate: prog.week.rate },
      { label: '本月', rate: prog.month.rate }
    ];
    document.getElementById('meter-grid').innerHTML = meters.map(m =>
      '<div class="meter-cell ' + app.rateClass(m.rate) + '">' +
      '<div class="meter-num">' + app.rateText(m.rate) + '</div>' +
      '<div class="meter-label">' + m.label + '</div></div>'
    ).join('');
    const baseline = store.settings.completionBaseline;
    document.getElementById('baseline-tip').textContent =
      '底线 ' + Math.round(baseline * 100) + '%：达到即算稳，不追求满分';

    // 月目标列表（AI 维护，只读）
    const goalBox = document.getElementById('goal-list');
    if (prog.goals.length === 0) {
      goalBox.innerHTML = '<div class="empty-state"><div class="empty-icon"><span data-icon="target" data-icon-size="40"></span></div>' +
        '<div class="text-sm">还没有月目标</div>' +
        '<div class="text-xs mt-1">把最近一张试卷照片发到 WorkBuddy 对话里，AI 会根据错题自动定目标、拆到每天</div></div>';
    } else {
      goalBox.innerHTML = prog.goals.map(g => {
        const goal = g.goal;
        const dev = g.deviation;
        let devTag = '';
        if (dev < -0.25) devTag = '<span class="tag" style="background:#fdecec;color:#991b1b;">明显落后</span>';
        else if (dev < -0.10) devTag = '<span class="tag" style="background:#fff7e6;color:#92400e;">略落后</span>';
        else devTag = '<span class="tag" style="background:#eafaf0;color:#166534;">正常</span>';
        let valueText = '';
        if (goal.metric.type === 'accuracy' || goal.metric.type === 'score') {
          valueText = goal.lastMeasured === null ? '尚未测' : '最近 ' + goal.lastMeasured + goal.metric.unit + ' / 目标 ' + goal.metric.target + goal.metric.unit;
        } else {
          valueText = '进度 ' + Math.round(g.progress * 100) + '%';
        }
        return '<div style="margin-bottom:12px;">' +
          '<div class="flex items-center justify-between mb-1">' +
          '<div class="flex items-center gap-2">' + app.subjectTag(goal.subject) +
          '<span class="text-sm font-semibold" style="color:var(--text-strong);">' + app.escapeHtml(goal.title) + '</span></div>' + devTag + '</div>' +
          app.progressBar(g.progress) +
          '<div class="text-xs mt-1" style="color:var(--muted);">' + valueText + '</div></div>';
      }).join('');
    }

    // 近 7 日完成率图
    const labels = [], values = [];
    for (let i = 6; i >= 0; i--) {
      const d = E.date.shift(today, -i);
      labels.push(d.slice(5).replace('-', '/'));
      const list = (store.todos[d] || []);
      const r = E.completionRate(list);
      values.push(r === null ? null : Math.round(r * 100));
    }
    if (J1Charts.available()) {
      J1Charts.completionTrend('week', document.getElementById('chart-week'), labels, values);
    } else {
      document.getElementById('chart-week').parentElement.innerHTML =
        '<div class="empty-state text-xs">图表暂不可用（离线），数据不受影响</div>';
    }

    // 考试分数趋势（时间正序，百分制）
    const examSorted = store.exams.slice().sort((a, b) => a.date < b.date ? -1 : 1);
    const examTxt = document.getElementById('exam-trend-text');
    if (J1Charts.available() && examSorted.length) {
      J1Charts.examTrend('exam', document.getElementById('chart-exam'),
        examSorted.map(e => e.date.slice(5)),
        examSorted.map(e => Math.round(e.score / (e.fullScore || 100) * 100)));
      if (examSorted.length >= 2) {
        const a = examSorted[examSorted.length - 2], b = examSorted[examSorted.length - 1];
        const diff = Math.round((b.score / (b.fullScore || 100) - a.score / (a.fullScore || 100)) * 100);
        examTxt.textContent = '最近一次 vs 上一次：' + (diff > 0 ? '进步 ' + diff + ' 个百分点' :
          diff === 0 ? '持平，稳住了' : '回落 ' + (-diff) + ' 个百分点，看看错题卡在哪');
        examTxt.style.color = diff > 0 ? 'var(--success)' : diff === 0 ? 'var(--muted)' : 'var(--warning)';
      } else {
        examTxt.textContent = '只跟自己比，不比排名';
      }
    } else {
      document.getElementById('chart-exam').parentElement.innerHTML =
        '<div class="empty-state text-xs" style="padding:24px 0;">' +
        (examSorted.length ? '图表暂不可用（离线）' : '还没有考试记录——考试卷拍给 AI 就会出现在这里') + '</div>';
    }

    // 错题科目分布
    const subjCount = { math: 0, chinese: 0, english: 0, other: 0 };
    store.mistakes.forEach(m => { if (!m.archived) subjCount[m.subject] = (subjCount[m.subject] || 0) + 1; });
    const hasMistake = (subjCount.math + subjCount.chinese + subjCount.english + subjCount.other) > 0;
    if (J1Charts.available()) {
      J1Charts.doughnut('mistake', document.getElementById('chart-mistake'),
        ['数学', '语文', '英语'], [subjCount.math, subjCount.chinese, subjCount.english]);
      if (!hasMistake) {
        document.getElementById('chart-mistake').parentElement.insertAdjacentHTML('afterbegin',
          '<div class="text-xs text-center mb-1" style="color:var(--muted);">还没有错题记录</div>');
      }
    }

    // 需关注
    const items = [];
    if (prog.carryPile >= 3) {
      items.push({ cls: 'danger', text: '今天有 ' + prog.carryPile + ' 条顺延任务，先清顺延，新任务别超过 2 项', link: 'tasks.html', linkText: '去处理' });
    }
    const stag = E.findStagnant(store);
    stag.slice(0, 3).forEach(t => {
      items.push({ cls: 'danger', text: '停滞：' + app.escapeHtml(t.title) + '（顺延 ' + t.carryCount + ' 次未完成）', link: 'tasks.html', linkText: '去处置' });
    });
    // 到期重做
    const due = [];
    store.mistakes.forEach(m => {
      if (m.archived) return;
      (m.reviewSchedule || []).forEach(rv => {
        if (!rv.done && E.date.diff(rv.date, today) >= 0 && E.date.diff(today, rv.date) <= 3) {
          due.push(m);
        }
      });
    });
    const dueUnique = Array.from(new Set(due.map(m => m.id)));
    if (dueUnique.length > 0) {
      items.push({ cls: '', text: '有 ' + dueUnique.length + ' 道错题进入重做窗口（艾宾浩斯 D1/D3/D7）', link: 'mistakes.html', linkText: '去重做' });
    }
    // 薄弱知识点
    const tops = E.weakIndex(store.mistakes, store.kpointStates, store.settings, today, store.exams)
      .slice(0, store.settings.topN || 3);
    if (tops.length >= 1) {
      const kmap = {};
      store.getKpoints(true).forEach(k => { kmap[k.id] = k; });
      const t0 = tops[0], k0 = kmap[t0.kpointId];
      items.push({ cls: '', text: '最薄弱：' + (k0 ? k0.name : t0.kpointId) + '（' + t0.mistakeCount + ' 题错题）', link: 'plan.html', linkText: '看补学计划' });
    }
    // 备份提醒
    const lastExp = store.meta.lastExportAt;
    if (!lastExp || (Date.now() - new Date(lastExp).getTime()) / 86400000 > 7) {
      items.push({ cls: '', text: '超过 7 天没备份了，建议导出一次 JSON', link: 'settings.html', linkText: '去备份' });
    }
    const attBox = document.getElementById('attention-list');
    attBox.innerHTML = items.length === 0
      ? '<div class="text-sm text-center py-3" style="color:var(--muted);">一切正常，按自己的节奏走</div>'
      : items.map(it =>
        '<div class="attention-item ' + it.cls + '"><span>' + it.text + '</span>' +
        '<a href="' + it.link + '" class="btn btn-sm btn-ghost no-underline" style="text-decoration:none;flex-shrink:0;">' + it.linkText + '</a></div>'
      ).join('');

    // 快捷入口
    const I = J1Icons;
    document.getElementById('quick-grid').innerHTML = [
      { icon: 'clipboard', label: '今日待办给孩子', href: 'print.html' },
      { icon: 'book', label: '错题库', href: 'mistakes.html' },
      { icon: 'target', label: '补学计划', href: 'plan.html' },
      { icon: 'leaf', label: '激励成长', href: 'growth.html' },
      { icon: 'clock', label: '今日勾选', href: 'tasks.html' },
      { icon: 'settings', label: '备份修复', href: 'settings.html' }
    ].map(q =>
      '<a class="quick-item" href="' + q.href + '"><span class="quick-icon">' + I.render(q.icon, 22) + '</span>' + q.label + '</a>'
    ).join('');
  }

  document.addEventListener('DOMContentLoaded', function () {
    app.injectNav();
    J1Icons.hydrate();
    try { render(); } catch (e) {
      console.error(e);
    }
  });
})();
</script>
</body>
</html>
