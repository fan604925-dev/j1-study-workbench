<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2f80ed">
<title>设置 · 初一学习工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-container">
  <div class="sticky-header flex items-center justify-between">
    <a href="index.html" class="text-sm" style="color:var(--brand);text-decoration:none;">‹ 返回看板</a>
    <div class="font-bold flex items-center gap-1" style="color:var(--text-strong);"><span data-icon="settings" data-icon-size="18"></span> 设置</div>
    <span class="text-sm" style="color:var(--muted);">家长专用</span>
  </div>

  <div class="card" style="border-left:3px solid var(--brand);">
    <div class="text-xs" style="color:var(--muted);line-height:1.7;">
      孩子概况、学习节奏、目标与计划等参数由 AI 根据你发来的材料自动维护；要调整时，在 WorkBuddy 对话里说一句就行（如「番茄钟改成 20 分钟」「最近数学重点补计算」）。
    </div>
  </div>

  <!-- 数据管理 -->
  <div class="card">
    <div class="card-title flex items-center gap-1"><span data-icon="archive" data-icon-size="16"></span> 数据管理</div>
    <div class="text-xs mb-2" id="backup-tip" style="color:var(--muted);"></div>
    <div class="flex gap-2 flex-wrap">
      <button class="btn btn-primary btn-sm flex items-center gap-1" onclick="exportData()"><span data-icon="copy" data-icon-size="14"></span> 导出备份 JSON</button>
      <label class="btn btn-outline btn-sm flex items-center gap-1" style="cursor:pointer;"><span data-icon="download" data-icon-size="14"></span> 导入备份
        <input type="file" accept=".json" style="display:none;" onchange="importData(event)"></label>
      <button class="btn btn-outline btn-sm flex items-center gap-1" onclick="app.repairAndReload()"><span data-icon="wrench" data-icon-size="14"></span> 一键修复（不删数据）</button>
      <button class="btn btn-danger btn-sm flex items-center gap-1" onclick="resetAll()"><span data-icon="trash" data-icon-size="14"></span> 重置全部数据</button>
    </div>
  </div>

  <!-- 知识点图谱（只读查看） -->
  <div class="card">
    <div class="card-title flex items-center gap-1"><span data-icon="read" data-icon-size="16"></span> 知识点图谱</div>
    <div class="text-xs mb-2" style="color:var(--muted);">内置初一上三科知识点（含补学处方），由 AI 在归类错题时使用；需要补充时在对话里说一句</div>
    <div id="kpoint-list"></div>
  </div>

  <div class="card">
    <div class="card-title flex items-center gap-1"><span data-icon="eye" data-icon-size="16"></span> 版本与同步</div>
    <div class="text-xs" id="version-info" style="color:var(--muted);line-height:1.8;"></div>
  </div>
</div>
<div id="bottom-nav"></div>

<script src="js/data/kpoints.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  'use strict';

  function render() {
    renderKpoints();
    renderVersion();
  }

  function renderKpoints() {
    const all = J1Store.getKpoints(true);
    const box = document.getElementById('kpoint-list');
    const bySubj = {};
    all.forEach(k => {
      if (!bySubj[k.subject]) bySubj[k.subject] = [];
      bySubj[k.subject].push(k);
    });
    let html = '';
    Object.keys(bySubj).forEach(subj => {
      html += '<div class="font-bold text-sm mt-3 mb-1">' + app.subjectName(subj) + '（' + bySubj[subj].length + ' 点）</div>';
      bySubj[subj].forEach(k => {
        const st = J1Store.kpointStates[k.id];
        const disabled = k.enabled === false;
        html += '<details class="mb-1" style="opacity:' + (disabled ? 0.5 : 1) + ';">' +
          '<summary class="text-sm py-1" style="cursor:pointer;">' + app.escapeHtml(k.name) +
          ' <span class="text-xs" style="color:var(--muted);">' + app.escapeHtml(k.chapter) + '</span>' +
          (st && st.lit ? ' <span class="tag" style="background:#eafaf0;color:#166534;">已点亮</span>' : '') +
          (disabled ? '（未启用）' : '') + '</summary>' +
          '<div class="text-xs pl-4 py-1" style="color:var(--muted);">' +
          '<div>微讲：' + app.escapeHtml(k.prescription.microLesson) + '</div>' +
          '<div>练习：' + app.escapeHtml(k.prescription.practiceTypes.join(' / ')) + '</div>' +
          '<div>掌握标准：' + app.escapeHtml(k.prescription.masteryCriteria) + '</div>' +
          '<div>预计 ' + k.prescription.estMinutes + ' 分钟</div></div>' +
          '</details>';
      });
    });
    box.innerHTML = html;
  }

  function renderVersion() {
    const meta = J1Store.meta;
    let feedInfo = '还没有同步过 AI 数据';
    if (meta.lastFeedAt) {
      const t = new Date(meta.lastFeedAt);
      feedInfo = '上次同步：' + (t.getMonth() + 1) + '/' + t.getDate() + '（第 ' + (meta.lastFeedVersion || 0) + ' 次）';
    }
    document.getElementById('version-info').textContent =
      '数据版本 ' + J1Constants.DATA_VERSION + ' · 缓存版本 j1-v2 · ' + feedInfo + '。' +
      '数据跟着链接走：换链接/换手机前请先导出备份再导入。';
    const last = J1Store.meta.lastExportAt;
    document.getElementById('backup-tip').textContent = last
      ? '上次备份：' + new Date(last).toLocaleDateString('zh-CN')
      : '还没有导出过备份，建议每周导出一次';
  }

  window.exportData = function () {
    const data = J1Store.exportData();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '初一学习工作台_备份_' + J1Engine.date.today() + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    renderVersion();
    app.toast('备份已导出');
  };

  window.importData = function (ev) {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const data = JSON.parse(reader.result);
        const res = J1Store.importData(data);
        if (res.ok) { app.toast('导入成功'); render(); }
        else app.toast(res.warnings[0] || '导入失败');
      } catch (e) {
        app.toast('文件解析失败，请确认是本工作台导出的 JSON');
      }
    };
    reader.readAsText(file, 'utf-8');
    ev.target.value = '';
  };

  window.resetAll = function () {
    if (!app.confirm('重置会清空全部目标/待办/错题/考试记录（激励记录也会清空）。\n建议先「导出备份」。确定重置吗？')) return;
    if (!app.confirm('再次确认：真的要清空所有数据吗？')) return;
    J1Store.clearData();
    location.reload();
  };

  document.addEventListener('DOMContentLoaded', function () {
    app.injectNav();
    J1Icons.hydrate();
    try { render(); } catch (e) { console.error(e); }
  });
})();
</script>
</body>
</html>
